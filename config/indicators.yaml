# Indicators. Decision D4 (see DECISIONS.md).
# direction: +1 means a higher raw value means MORE risk.
# name_ur / reason_ur are intentionally empty: D9 ships English only for v1, but the
# fields stay so Urdu can be added later without a schema change.

indicators:
  - id: lst_day_mean
    name_en: Daytime surface temperature
    name_ur: ""
    dimension: hazard
    unit: "degC"
    direction: 1
    transform: none
    source: Landsat 8/9 Collection 2 Level-2, April-June median composite
    reason_en: "The ground here gets hotter on summer afternoons"
    reason_ur: ""

  - id: population
    name_en: People living here
    name_ur: ""
    dimension: exposure
    unit: "people per cell"
    direction: 1
    transform: log1p
    source: Meta high-resolution population density / WorldPop constrained 100 m
    reason_en: "More people live in this area"
    reason_ur: ""

  - id: lack_green
    name_en: Lack of green cover
    name_ur: ""
    dimension: vulnerability
    unit: "fraction"
    direction: 1
    transform: none
    source: ESA WorldCover 10 m and/or Sentinel-2 hot-season NDVI
    reason_en: "Little greenery or shade"
    reason_ur: ""

  - id: dist_health
    name_en: Distance to nearest health facility
    name_ur: ""
    dimension: vulnerability
    unit: "m"
    direction: 1
    transform: none
    source: OpenStreetMap hospitals, clinics and doctors (ODbL 1.0)
    reason_en: "Further from the nearest clinic or hospital"
    reason_ur: ""

  - id: dist_centre
    name_en: Distance to nearest verified relief centre
    name_ur: ""
    dimension: vulnerability
    unit: "m"
    direction: 1
    transform: none
    source: data/manual/centres.csv, verified in person by Samraj
    reason_en: "Further from the nearest relief centre"
    reason_ur: ""
    notes: >
      Also used by the allocation planner (Phase 4). The model report must state
      this double use. Blocked until at least one centre is verified (QUESTIONS.md Q2).

# Recorded so the reasons are not lost. See DECISIONS.md D4.
dropped:
  - id: built_fraction
    reason: >
      Dropped by D19 (2026-09-26), approved by Samraj. Measured from ESA WorldCover, which
      assigns each 10 m pixel exactly one class, built_fraction and lack_green correlate at
      about +0.93 (built vs green r = -0.929), so two of Vulnerability's four indicators were
      near-duplicates. More importantly, built-up surface is a CAUSE of the high land surface
      temperature that the Hazard dimension already measures directly, so keeping it would
      count the same physical fact twice -- once as cause, once as effect. Still computed and
      stored in data/processed/landcover_cells.csv as context for the cell panel, in the same
      way the LST 90th percentile is computed but not indexed.
  - id: share_over60
    reason: >
      Dropped by D17 (2026-09-26), approved by Samraj. Measured over Landhi, share_over60
      and share_under5 correlate at exactly -1.0000, 86% of cells sit on just two values,
      and their sum spans only 0.15291-0.15441 (CV 0.0045, against 0.028 for LST and 0.994
      for population). Meta applies an administrative-unit age profile rather than modelling
      age spatially, and Landhi spans two such zones, so the pair is one binary variable with
      opposite signs. Both carry direction +1 in the same weighted mean, so they would largely
      cancel while consuming two of six weights. The COUNTS (people_over60, people_under5) do
      vary and are retained in data/processed/age_cells.csv for D8's need definition.
  - id: share_under5
    reason: >
      Dropped by D17 alongside share_over60; see that entry. The two are the same variable
      with opposite signs, so dropping one without the other would leave a binary
      administrative-zone split masquerading as demography.
  - id: lst_night
    reason: >
      MODIS night LST is 1 km. About 25 pixels cover the whole 25.37 km2 pilot area
      across 242 cells, so between-cell variation would be an artefact of area
      weighting rather than a measurement. ECOSTRESS (~70 m) is a v2 candidate.
  - id: rwi
    reason: >
      Meta Relative Wealth Index tiles are ~2.4 km; four or five cover all of Landhi,
      so the indicator would be near-constant and would cost an AHP comparison for
      no information.

  - id: load_shedding
    reason: >
      Dropped by D20 (2026-09-26), approved by Samraj after the P1-10 feasibility study.
      K-Electric's published schedule has 620 feeder rows across 58 grid stations, 26 on the
      LANDHI grid, with daily outage from 4.0 to 10.0 hours -- so the quantity exists and
      varies substantially. But the schedule gives only a feeder name and a grid station: no
      coordinates, no boundaries, no street lists. Their own place-to-feeder route is a
      13-digit account number in an app. Spreading 26 feeders across 265 cells would require
      inventing a service boundary K-Electric has not published, which section 2.1 forbids.
      The study (docs/load-shedding-feasibility.md) records the v2 fieldwork route: feeder
      names printed on K-Electric bills tie feeders to real addresses.
