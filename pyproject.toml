[project]
name = "karachi-heat-map"
version = "1.0.0"
description = "Heat priority mapping for relief planning in Landhi Town, Karachi"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "requests>=2.32",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "h3>=4.3,<4.4",  # 4.4+ ships no Intel macOS wheel; 4.3.1 is the last cp312 x86_64 build
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "matplotlib>=3.9",
  "jsonschema>=4.23",
  "pypdf>=6.19.0",
  "markdown>=3.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not built as a wheel, so put the repo root on sys.path
# to make `pipeline` importable from tests.
pythonpath = ["."]
markers = [
  "raw: needs the data/raw download cache; runs locally, skipped in CI",
]
addopts = "-q"
