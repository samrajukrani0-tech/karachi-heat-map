name: checks and pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "true"          # scripts/check.py then runs pytest with -m "not raw"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked
      # Without these, html-validate, Playwright and axe report "not applicable" in CI
      # and Pages could deploy a site nothing had checked.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Quality gates
        run: uv run python scripts/check.py --quick
      - name: Progress
        run: uv run python scripts/features.py

  deploy:
    # Pages deploys from main only when the checks above pass.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
